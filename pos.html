<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS — StokKu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="h-screen overflow-hidden flex flex-col">
    <!-- POS top bar -->
    <header class="topbar h-16 shrink-0 flex items-center gap-3 px-3 sm:px-5">
      <a id="home-link" href="#" class="flex items-center gap-2.5" title="Back">
        <svg viewBox="0 0 32 32" class="w-8 h-8"><rect width="32" height="32" rx="9" fill="#F2683A" /><path d="M9 12.5 16 9l7 3.5v7L16 23l-7-3.5z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" /><path d="M9 12.5 16 16l7-3.5M16 16v7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" /></svg>
        <span class="hidden sm:block leading-tight whitespace-nowrap"><span class="block text-sm font-extrabold">Stok<span class="text-brand-400">Ku</span> POS</span><span class="block text-[11px] text-white/50" id="store-name">…</span></span>
      </a>
      <div class="w-px h-7 bg-white/15 mx-1 hidden md:block"></div>
      <nav class="hidden md:flex items-center gap-1" id="pos-nav"></nav>
      <div class="flex-1"></div>
      <div class="hidden xl:flex items-center gap-2 text-white/60 text-xs bg-white/5 rounded-full px-3 py-1.5 whitespace-nowrap">
        <kbd class="px-1.5 rounded bg-white/10 text-white/80 font-sans">F2</kbd>Search
        <kbd class="px-1.5 rounded bg-white/10 text-white/80 font-sans ml-2">F4</kbd>Barcode
        <kbd class="px-1.5 rounded bg-white/10 text-white/80 font-sans ml-2">F9</kbd>Pay
      </div>
      <div class="text-right leading-tight hidden sm:block">
        <div class="text-sm font-bold tabular-nums" id="clock">--:--</div>
        <div class="text-[11px] text-white/50" id="today"></div>
      </div>
      <div class="w-px h-7 bg-white/15 mx-1"></div>
      <div class="flex items-center gap-2" id="cashier"></div>
      <button class="topbar-btn" id="logout" title="Log out"><i data-lucide="log-out"></i></button>
    </header>

    <div class="flex-1 min-h-0 grid lg:grid-cols-[1fr_420px]">
      <!-- Catalog -->
      <section class="min-h-0 flex flex-col p-4 sm:p-5 gap-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="input-icon flex-1">
            <i data-lucide="search"></i>
            <input id="search" class="input h-12 text-base" placeholder="Search products by name or SKU (F2)" autocomplete="off" />
          </div>
          <div class="input-icon sm:w-72 relative">
            <i data-lucide="scan-barcode"></i>
            <input id="barcode" class="input h-12 text-base font-mono" placeholder="Scan barcode (F4)" autocomplete="off" />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1.5 text-[10px] font-semibold text-green-600" id="scanner-ready">
              <span class="relative flex w-2 h-2"><span class="absolute inset-0 rounded-full bg-green-500 animate-ping opacity-60"></span><span class="relative w-2 h-2 rounded-full bg-green-500"></span></span>READY
            </span>
          </div>
        </div>
        <div class="flex gap-2 overflow-x-auto thin-scroll pb-1" id="categories"></div>
        <div class="flex-1 min-h-0 overflow-y-auto thin-scroll -mx-1 px-1 pb-24 lg:pb-2">
          <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3"></div>
        </div>
      </section>

      <!-- Cart -->
      <aside id="cart-panel" class="fixed inset-x-0 bottom-0 top-16 z-40 translate-y-full lg:translate-y-0 transition-transform duration-300 lg:static bg-white border-l border-ink-100 flex flex-col min-h-0">
        <div class="px-5 py-4 border-b border-ink-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="relative kpi-icon bg-brand-50 text-brand-600" id="cart-icon"><i data-lucide="shopping-bag"></i>
              <span id="cart-count" class="absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full bg-ink-900 text-white text-[10px] font-bold grid place-items-center">0</span></div>
            <div><p class="font-bold">Current order</p><p class="text-xs text-ink-500" id="cart-sub">No items yet</p></div>
          </div>
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-sm text-red-500" id="clear-cart"><i data-lucide="trash-2"></i>Clear</button>
            <button class="btn btn-ghost btn-icon btn-sm lg:hidden" id="close-cart"><i data-lucide="chevron-down"></i></button>
          </div>
        </div>
        <div class="flex-1 min-h-0 overflow-y-auto thin-scroll" id="cart-items"></div>
        <div class="border-t border-ink-100 p-5 space-y-2.5 bg-[#fcfcfd]">
          <div class="flex justify-between text-sm"><span class="text-ink-500">Subtotal</span><span class="font-semibold tabular-nums" id="t-subtotal">Rp 0</span></div>
          <div class="flex justify-between text-sm items-center gap-3">
            <span class="text-ink-500">Order discount</span>
            <div class="flex items-center gap-1">
              <div class="segmented !p-0.5" id="disc-mode"><button class="active !px-2 !py-1" data-mode="rp">Rp</button><button class="!px-2 !py-1" data-mode="pct">%</button></div>
              <input id="t-discount" class="input h-8 w-28 text-right" inputmode="numeric" placeholder="0" />
            </div>
          </div>
          <div class="flex justify-between text-xs text-ink-400" id="disc-row" hidden><span>Discount</span><span id="t-disc-amount"></span></div>
          <div class="flex justify-between items-end pt-3 border-t border-dashed border-ink-200">
            <span class="font-semibold">Total</span>
            <span class="text-3xl font-extrabold tracking-tight tabular-nums" id="t-total">Rp 0</span>
          </div>
          <button class="btn btn-primary btn-lg w-full !h-14 text-base mt-2" id="pay-btn" disabled><i data-lucide="wallet"></i>Pay <span class="opacity-60 text-sm font-medium">(F9)</span></button>
        </div>
      </aside>
    </div>

    <!-- Mobile cart toggle -->
    <button id="open-cart" class="lg:hidden fixed bottom-4 inset-x-4 z-30 btn btn-dark btn-lg !h-14 justify-between shadow-2xl">
      <span class="flex items-center gap-2"><i data-lucide="shopping-bag"></i><span id="m-count">0 items</span></span>
      <span id="m-total" class="font-extrabold">Rp 0</span>
    </button>

    <script src="js/seed.js"></script>
    <script src="js/db.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/pos.js"></script>
  </body>
</html>
