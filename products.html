<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — StokKu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main id="content" class="p-4 sm:p-6 lg:p-8 max-w-[1500px] mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">Products & Master Data</h2>
          <p class="text-sm text-ink-500 mt-1">Manage your product catalog, categories and suppliers.</p>
        </div>
        <div class="flex gap-2" id="header-actions"></div>
      </div>

      <div class="tabs mt-6" id="tabs">
        <button class="tab active" data-tab="products">Products</button>
        <button class="tab owner-only" data-tab="categories">Categories</button>
        <button class="tab owner-only" data-tab="suppliers">Suppliers</button>
        <span class="tab-ink" id="tab-ink"></span>
      </div>

      <!-- Products tab -->
      <section data-panel="products" class="mt-6">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 stagger" id="summary"></div>

        <div class="card mt-5">
          <div class="p-4 flex flex-col xl:flex-row gap-3 xl:items-center border-b border-ink-100">
            <div class="input-icon flex-1 min-w-0">
              <i data-lucide="search"></i>
              <input id="search" class="input" placeholder="Search name, SKU or barcode..." autocomplete="off" />
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 xl:flex">
              <select id="f-category" class="select xl:w-44"><option value="">All categories</option></select>
              <select id="f-status" class="select xl:w-40">
                <option value="">All stock</option>
                <option value="ok">In stock</option>
                <option value="low">Low</option>
                <option value="out">Out of stock</option>
              </select>
              <select id="f-sort" class="select xl:w-48">
                <option value="name:asc">Name A–Z</option>
                <option value="name:desc">Name Z–A</option>
                <option value="stock:asc">Lowest stock</option>
                <option value="stock:desc">Highest stock</option>
                <option value="sellingPrice:desc">Highest price</option>
                <option value="sellingPrice:asc">Lowest price</option>
                <option value="updatedAt:desc">Recently updated</option>
              </select>
              <select id="f-size" class="select xl:w-32">
                <option value="10">10 / page</option>
                <option value="20">20 / page</option>
                <option value="50">50 / page</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th class="num">Cost Price</th>
                  <th class="num">Selling Price</th>
                  <th>Stock</th>
                  <th>Status</th>
                  <th class="num">Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="state"></div>
          <div id="pager"></div>
        </div>
      </section>

      <!-- Categories tab -->
      <section data-panel="categories" class="mt-6 hidden">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 stagger" id="category-grid"></div>
      </section>

      <!-- Suppliers tab -->
      <section data-panel="suppliers" class="mt-6 hidden">
        <div class="card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Supplier</th><th>Contact</th><th>Address</th><th class="num">Products</th><th class="num">Actions</th></tr>
              </thead>
              <tbody id="supplier-rows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="js/seed.js"></script>
    <script src="js/db.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/products.js"></script>
  </body>
</html>
